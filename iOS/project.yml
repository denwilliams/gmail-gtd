# The iPhone app. Generate the Xcode project with `make ios-project` (needs XcodeGen: `brew install xcodegen`).
# The project file is not committed; this file is the source of truth.
name: GmailGTDiOS
options:
  bundleIdPrefix: dev.denw
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  GmailGTD:
    path: ..
targets:
  GmailGTDiOS:
    type: application
    platform: iOS
    sources:
      - path: GmailGTD
      # Shared with the Mac app: the model and the small views that suit both.
      - path: ../Sources/GmailGTD/AppModel.swift
        group: Shared
      - path: ../Sources/GmailGTD/BucketStyle.swift
        group: Shared
      - path: ../Sources/GmailGTD/ForegroundMailRefresh.swift
        group: Shared
      - path: ../Sources/GmailGTD/FacetViews.swift
        group: Shared
      - path: ../Sources/GmailGTD/JevStatusView.swift
        group: Shared
    dependencies:
      - package: GmailGTD
        product: GTDCore
    settings:
      base:
        PRODUCT_NAME: Gmail GTD
        PRODUCT_BUNDLE_IDENTIFIER: dev.denw.gmail-gtd.ios
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gmail GTD
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        # Set your team to run on a device: `make ios-device TEAM=XXXXXXXXXX`, or pick it in Xcode.
        DEVELOPMENT_TEAM: ""
